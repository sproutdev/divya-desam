<title>Divya Desam Yatra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one temple a day. One screen, one photo, one thing to tap. A fixed bar at the bottom holds the only three controls. */
:root {
  --bg: #f7eedc;        /* sandal paste */
  --bg-2: #ecdcbb;      /* deeper sandal, wells and chips */
  --card: #fffaf0;
  --fg: #141a33;        /* neela megha: blue-black of Perumal */
  --fg-2: #3f4460;
  --line: #cdb88f;
  --accent: #a8281f;    /* srichurnam red */
  --accent-fg: #ffffff;
  --gold: #d7961a;      /* marigold garland */
  --gold-fg: #1f1503;
  --tulasi: #25713f;    /* done */
  --shadow: 0 6px 18px rgba(60, 40, 10, .16);
  --display: "Baloo Thambi 2", "Noto Sans Tamil", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Noto Sans Tamil", "Helvetica Neue", Arial, system-ui, sans-serif;
  --bar: 84px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11162a; --bg-2: #1c2340; --card: #202948; --fg: #f6eedb; --fg-2: #cfcadb; --line: #3b4670;
  --accent: #e45a4e; --accent-fg: #ffffff; --gold: #f2b43e; --gold-fg: #1f1503; --tulasi: #62c98a;
  --shadow: 0 6px 18px rgba(0,0,0,.45); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11162a; --bg-2: #1c2340; --card: #202948; --fg: #f6eedb; --fg-2: #cfcadb; --line: #3b4670;
  --accent: #e45a4e; --accent-fg: #ffffff; --gold: #f2b43e; --gold-fg: #1f1503; --tulasi: #62c98a;
  --shadow: 0 6px 18px rgba(0,0,0,.45); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 21px/1.5 var(--body); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.15; margin: 0; text-wrap: balance; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px calc(var(--bar) + 28px + env(safe-area-inset-bottom, 0px)); max-width: 720px; margin: 0 auto; }
.view[hidden] { display: none !important; }
:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }
.eyebrow { font-size: 16px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-2); font-weight: 700; }

/* top line */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 24px; font-weight: 800; }
.brand svg { width: 36px; height: 36px; }
.toplink { border: 0; background: transparent; font-family: var(--display); font-weight: 700; font-size: 19px; color: var(--accent); padding: 10px 0; min-height: 48px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: underline; text-underline-offset: 4px; }
.toplink svg { width: 22px; height: 22px; }

/* day line and garland bar */
.day { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 8px; }
.day h2 { font-size: 24px; font-variant-numeric: tabular-nums; }
.day span { color: var(--fg-2); font-size: 17px; }
.garland { height: 14px; background: var(--bg-2); border-radius: 999px; overflow: hidden; margin-top: 8px; border: 1px solid var(--line); }
.garland i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--gold) 0 10px, var(--accent) 10px 14px); border-radius: 999px; transition: width .5s; }

/* the temple */
.temple { margin-top: 14px; }
.photo { position: relative; border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); background: #000; width: 100%; border: 0; padding: 0; display: block; cursor: pointer; text-align: left; color: #fff8ea; }
.photo img { width: 100%; aspect-ratio: 4/3; object-fit: cover; }
.photo .play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 104px; height: 104px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.45); border: 4px solid #fff8ea; }
.photo .play svg { width: 48px; height: 48px; margin-left: 6px; }
.photo .label { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 16px 14px; background: linear-gradient(to top, rgba(10,12,30,.9), transparent); font-family: var(--display); font-weight: 700; font-size: 20px; }
.photo iframe { display: block; width: 100%; aspect-ratio: 16/9; border: 0; }
.vmeta { margin: 8px 2px 0; font-size: 16px; color: var(--fg-2); }

.names { padding-block: 14px 4px; }
.names .ta { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1.25; }
.names h1 { font-size: 30px; margin-top: 2px; }
.names .alt { color: var(--fg-2); font-size: 18px; margin-top: 4px; }
.facts { display: grid; gap: 10px; margin-top: 12px; }
.fact { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px 16px; min-width: 0; }
.fact div:last-child { font-size: 21px; font-weight: 700; overflow-wrap: anywhere; line-height: 1.35; }

.btn { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 68px; border-radius: 18px; border: 3px solid var(--line); background: var(--card); font-family: var(--display); font-weight: 700; font-size: 22px; padding: 12px 18px; cursor: pointer; text-decoration: none; color: var(--fg); width: 100%; margin-top: 14px; }
.btn svg { width: 28px; height: 28px; flex: 0 0 auto; }
.btn .sub { font-family: var(--body); font-weight: 400; font-size: 16px; color: var(--fg-2); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--gold-fg); }
.btn.gold .sub { color: var(--gold-fg); opacity: .8; }

.story { margin-top: 20px; }
.story p { margin: 0; max-width: 60ch; }
.story .clamp { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; }
.story .clamp.open { display: block; }
.readmore { border: 0; background: transparent; font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--accent); padding: 10px 0; min-height: 48px; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }

.more { margin-top: 10px; }
.more summary { cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 19px; padding: 12px 0; list-style: none; display: flex; align-items: center; gap: 10px; color: var(--fg-2); min-height: 48px; }
.more summary::before { content: ""; width: 11px; height: 11px; border-right: 3px solid currentColor; border-bottom: 3px solid currentColor; transform: rotate(-45deg); transition: transform .2s; }
.more[open] summary::before { transform: rotate(45deg); }
.vlist { display: grid; gap: 10px; }
.vlist button { display: flex; gap: 12px; align-items: center; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; color: var(--fg); text-align: left; cursor: pointer; min-height: 64px; width: 100%; }
.vlist .t { font-weight: 700; font-size: 17px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.vlist .c { font-size: 15px; color: var(--fg-2); }
.vlist svg { width: 26px; height: 26px; flex: 0 0 auto; color: var(--accent); }

.complete { margin-top: 18px; padding: 18px; border-radius: 18px; background: var(--gold); color: var(--gold-fg); font-family: var(--display); font-weight: 700; font-size: 22px; text-align: center; }
.alllink { margin-top: 26px; text-align: center; }

/* bottom bar: the only controls */
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 2px solid var(--line); padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); display: grid; grid-template-columns: 1fr 72px 1fr; gap: 6px; height: calc(var(--bar) + env(safe-area-inset-bottom, 0px)); z-index: 5; }
.bar button { border: 0; background: transparent; min-height: 72px; display: flex; align-items: center; justify-content: center; gap: 4px; font-family: var(--display); font-weight: 700; font-size: 19px; cursor: pointer; border-radius: 14px; margin-block: 6px; padding: 0 8px; min-width: 0; }
.bar button svg { width: 28px; height: 28px; flex: 0 0 auto; }
.bar button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar button[disabled] { opacity: .35; cursor: default; }
.bar .sound { background: var(--bg-2); }
.bar .sound[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

/* all temples */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 14px 8px; scrollbar-width: none; margin-inline: -4px; padding-inline: 4px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 10px 18px; font-size: 18px; font-weight: 700; min-height: 52px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip small { font-weight: 400; opacity: .75; margin-left: 4px; }
.note { color: var(--fg-2); font-size: 17px; margin: 4px 0 14px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (min-width: 620px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card { position: relative; border: 0; padding: 0; background: var(--card); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); text-align: left; cursor: pointer; display: flex; flex-direction: column; min-width: 0; }
.card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
.card .body { padding: 10px 12px 12px; }
.card .ta { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card .en { color: var(--fg-2); font-size: 15px; line-height: 1.3; margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.badge { position: absolute; top: 10px; left: 10px; background: var(--gold); color: var(--gold-fg); font-family: var(--display); font-weight: 700; font-size: 16px; padding: 4px 11px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.done { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border-radius: 50%; background: var(--tulasi); display: none; place-items: center; }
.card.seen .done { display: grid; }
.done svg { width: 22px; height: 22px; }
.foot { margin-top: 28px; color: var(--fg-2); font-size: 15px; text-align: center; }

.toast { position: fixed; left: 50%; bottom: calc(var(--bar) + 16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--fg); color: var(--bg); padding: 12px 22px; border-radius: 999px; font-weight: 700; opacity: 0; transition: all .25s; pointer-events: none; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; z-index: 6; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<div class="wrap">
  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4 L12 22 H16 L12 44 H36 L32 22 H36 Z" fill="var(--gold)"/><path d="M20 44 V32 a4 4 0 0 1 8 0 V44 Z" fill="var(--accent)"/><rect x="18" y="24" width="12" height="3" fill="var(--accent)"/></svg>
      <span>Divya Desam Yatra</span>
    </div>
    <button class="toplink" id="topLink"></button>
  </div>

  <section class="view" id="viewTemple">
    <div class="day" id="dayLine"><h2 id="dayTitle"></h2><span id="dayDate"></span></div>
    <div class="garland" id="garland" role="progressbar" aria-valuemin="0" aria-valuemax="108"><i id="garlandFill"></i></div>

    <div class="temple">
      <div id="photoWrap"></div>
      <div class="vmeta" id="vmeta"></div>
      <div class="names">
        <div class="ta" id="tTa" lang="ta"></div>
        <h1 id="tName"></h1>
        <div class="alt" id="tSub"></div>
      </div>
      <div class="facts">
        <div class="fact"><div class="eyebrow">Perumal and Thayar</div><div id="tDeities"></div></div>
        <div class="fact"><div class="eyebrow">Where</div><div id="tPlace"></div></div>
      </div>

      <button class="btn gold" id="storyBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18V6a2 2 0 0 1 2-2h4a3 3 0 0 1 3 3v13"/><path d="M21 18V6a2 2 0 0 0-2-2h-4a3 3 0 0 0-3 3v13"/><path d="M3 18a2 2 0 0 0 2 2h4a3 3 0 0 1 3 3"/><path d="M21 18a2 2 0 0 1-2 2h-4a3 3 0 0 0-3 3"/></svg><span>Hear the story in Tamil <span class="sub" id="storyMins"></span></span></button>

      <div class="story">
        <p class="clamp" id="tDesc"></p>
        <button class="readmore" id="readMore">Read more</button>
      </div>

      <details class="more" id="moreWrap"><summary>More videos of this temple</summary><div class="vlist" id="vlist"></div></details>
      <div class="complete" id="complete" hidden>Yatra complete. All 108 Divya Desams visited.</div>
      <div class="alllink"><button class="toplink" id="allLink">See all 108 temples <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button></div>
    </div>
  </section>

  <section class="view" id="viewAll" hidden>
    <div class="chips" id="chips" role="group" aria-label="Region"></div>
    <p class="note" id="regionNote"></p>
    <div class="grid" id="grid"></div>
    <p class="foot">Photos from Wikimedia Commons contributors. Videos play from YouTube.</p>
  </section>
</div>

<nav class="bar" id="bar" aria-label="Navigate">
  <button id="prevBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span id="prevLabel">Yesterday</span></button>
  <button class="sound" id="soundBtn" aria-pressed="false" aria-label="Read aloud"><svg id="soundOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg></button>
  <button id="nextBtn"><span id="nextLabel">Tomorrow</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
/*__DATA__*/
(function () {
  const $ = (id) => document.getElementById(id);
  const T = window.TEMPLES; const CFG = window.CONFIG || {};
  const NAME = CFG.name || 'Sujatha';
  const REGIONS = [
    ['Chola Nadu', 'Kaveri delta: Srirangam, Kumbakonam, Thanjavur, Thirunangur'],
    ['Nadu Nadu', 'Cuddalore and Kallakurichi'],
    ['Tondai Nadu', 'Kanchipuram, Chennai and around'],
    ['Malai Nadu', 'Kerala and Kanyakumari'],
    ['Pandya Nadu', 'Tirunelveli, Thoothukudi, Madurai, Srivilliputhur'],
    ['Vada Nadu', 'North India and Nepal: Ayodhya, Badrinath, Dwarka, Tirupati'],
    ['Vinnulagam', 'The two celestial abodes']
  ];
  const S = {
    get(k, d) { try { const v = localStorage.getItem('dd.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('dd.' + k, JSON.stringify(v)); } catch (e) {} }
  };

  // The yatra: one shrine per day she opens the app. A missed day waits; it never skips.
  const todayISO = new Date().toISOString().slice(0, 10);
  let day = S.get('day', 0);                 // 1-based index into T of today's shrine
  const last = S.get('last', null);
  if (last !== todayISO) { day = Math.min(day + 1, T.length); S.set('day', day); S.set('last', todayISO); }
  if (!day) { day = 1; S.set('day', 1); }

  let idx = day - 1;        // shrine being shown (0-based)
  let browse = false;       // true when she came from the All temples grid
  let region = 'All';
  let sound = S.get('sound', false);
  let interacted = false;
  document.addEventListener('pointerdown', () => { interacted = true; }, { once: true });

  const playIcon = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M6 4l14 8-14 8z"/></svg>';
  const check = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
  const hour = new Date().getHours();
  const greeting = (hour < 12 ? 'Good morning, ' : hour < 17 ? 'Good afternoon, ' : 'Good evening, ') + NAME;

  function showTemple(i, fromBrowse) {
    stopSpeech();
    idx = Math.max(0, Math.min(T.length - 1, i)); browse = !!fromBrowse;
    const t = T[idx];
    $('viewAll').hidden = true; $('viewTemple').hidden = false; window.scrollTo(0, 0);
    try { location.hash = browse ? 't' + t.key : 'today'; } catch (e) {}

    const sibs = T.filter(x => x.n === t.n);
    const shrine = sibs.length > 1 ? ' · shrine ' + (sibs.indexOf(t) + 1) + ' of ' + sibs.length : '';
    const doneNums = new Set(T.slice(0, day).map(x => x.n)).size;
    if (browse) {
      $('dayTitle').textContent = 'Divya Desam ' + t.n + ' of 108' + shrine; $('dayDate').textContent = t.region;
      $('topLink').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg> All temples';
      $('topLink').onclick = showAll;
      $('prevLabel').textContent = 'Previous'; $('nextLabel').textContent = 'Next';
      $('prevBtn').disabled = idx === 0; $('nextBtn').disabled = idx === T.length - 1;
    } else {
      const isToday = idx === day - 1;
      $('dayTitle').textContent = (isToday ? 'Day ' + day : 'Day ' + (idx + 1)) + ' · Divya Desam ' + t.n + ' of 108' + shrine;
      $('dayDate').textContent = isToday ? greeting : '';
      $('topLink').textContent = isToday ? '' : 'Back to today';
      $('topLink').onclick = () => showTemple(day - 1);
      $('prevLabel').textContent = 'Yesterday'; $('nextLabel').textContent = isToday ? 'Tomorrow' : 'Next day';
      $('prevBtn').disabled = idx === 0; $('nextBtn').disabled = idx >= day - 1;
    }
    $('prevBtn').onclick = () => showTemple(idx - 1, browse); $('nextBtn').onclick = () => showTemple(idx + 1, browse);
    $('garland').setAttribute('aria-valuenow', doneNums); $('garlandFill').style.width = (doneNums / 108 * 100) + '%';
    $('complete').hidden = !(day === T.length && idx === day - 1);

    $('tTa').textContent = t.ta || ''; $('tName').textContent = t.name;
    $('tSub').textContent = [t.alt, t.town !== t.name ? t.town : ''].filter(Boolean).join(' · ');
    $('tDeities').textContent = t.deities; $('tPlace').textContent = t.place;
    const text = (t.desc || t.notes || ('Divya Desam ' + t.n + ', ' + t.deities + ', at ' + t.place + '.')) + (t.desc && t.notes ? ' ' + t.notes : '');
    $('tDesc').textContent = text; $('tDesc').classList.remove('open'); $('readMore').textContent = 'Read more';

    renderPhoto(t);
    if (t.story) { $('storyBtn').hidden = false; $('storyMins').textContent = t.story.mins ? '· ' + t.story.mins + ' min' : '';
      $('storyBtn').onclick = () => play({ id: t.story.id, title: 'The story of ' + t.name + ', told in Tamil', channel: 'Velukkudi Discourses', mins: t.story.mins }); }
    else $('storyBtn').hidden = true;

    if (sound && interacted) speak(t);
  }

  function renderPhoto(t) {
    const w = $('photoWrap'); w.innerHTML = '';
    const v = t.videos[0];
    const el = document.createElement(v && !CFG.embed ? 'a' : 'button'); el.className = 'photo';
    if (el.tagName === 'A') { el.href = 'https://www.youtube.com/watch?v=' + v.id; el.target = '_blank'; el.rel = 'noopener'; } else el.type = 'button';
    el.innerHTML = '<img alt="">' + (v ? '<span class="play" aria-hidden="true">' + playIcon + '</span><span class="label">Tap to watch</span>' : '');
    el.querySelector('img').src = t.img; el.querySelector('img').alt = t.name;
    el.setAttribute('aria-label', v ? 'Watch a video of ' + t.name : t.name);
    if (v && CFG.embed) el.onclick = () => play(v);
    w.appendChild(el);
    $('vmeta').textContent = v ? 'Video by ' + v.channel + (v.mins ? ' · ' + v.mins + ' min' : '') : '';
    const vl = $('vlist'); vl.innerHTML = '';
    const rest = (t.videos || []).slice(1); $('moreWrap').hidden = !rest.length; $('moreWrap').open = false;
    rest.forEach(x => {
      const b = document.createElement('button'); b.type = 'button';
      b.innerHTML = playIcon.replace('#fff', 'currentColor') + '<div><div class="t"></div><div class="c"></div></div>';
      b.querySelector('.t').textContent = x.title; b.querySelector('.c').textContent = x.channel + (x.mins ? ' · ' + x.mins + ' min' : '');
      b.onclick = () => play(x); vl.appendChild(b);
    });
  }

  function play(v) {
    stopSpeech();
    if (!CFG.embed) { const a = document.createElement('a'); a.href = 'https://www.youtube.com/watch?v=' + v.id; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); return; }
    const w = $('photoWrap'); w.innerHTML = '';
    const box = document.createElement('div'); box.className = 'photo';
    const f = document.createElement('iframe'); f.allow = 'autoplay; fullscreen; picture-in-picture'; f.allowFullscreen = true;
    f.src = 'https://www.youtube-nocookie.com/embed/' + v.id + '?autoplay=1&rel=0&playsinline=1'; f.title = v.title;
    box.appendChild(f); w.appendChild(box);
    $('vmeta').textContent = 'Now playing · ' + v.channel + (v.mins ? ' · ' + v.mins + ' min' : '');
    w.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // read aloud
  function stopSpeech() { if (window.speechSynthesis) speechSynthesis.cancel(); }
  function speak(t) {
    if (!window.speechSynthesis) return;
    stopSpeech();
    const voices = speechSynthesis.getVoices();
    const ta = voices.find(v => /^ta/i.test(v.lang));
    const en = voices.find(v => /en-IN/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang));
    const parts = [];
    if (t.ta && ta) { const u = new SpeechSynthesisUtterance(t.ta); u.voice = ta; u.lang = ta.lang; u.rate = 0.9; parts.push(u); }
    const sentences = ($('tDesc').textContent.match(/[^.!?]+[.!?]+/g) || []).slice(0, 2).join(' ');
    const u2 = new SpeechSynthesisUtterance(t.name + '. ' + t.deities + '. ' + t.place + '. ' + sentences);
    if (en) u2.voice = en; u2.rate = 0.9; parts.push(u2);
    parts.forEach(u => speechSynthesis.speak(u));
  }
  function renderSound() { $('soundBtn').setAttribute('aria-pressed', sound); $('soundBtn').setAttribute('aria-label', sound ? 'Reading aloud is on. Tap to turn off' : 'Read aloud'); }
  $('soundBtn').onclick = () => {
    sound = !sound; S.set('sound', sound); renderSound();
    if (sound) { if (!window.speechSynthesis) { toast('Reading aloud is not available on this phone'); return; } if (!$('viewTemple').hidden) speak(T[idx]); toast('Reading aloud. Each temple will be read to you.'); }
    else { stopSpeech(); toast('Reading aloud is off'); }
  };
  if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};

  $('readMore').onclick = () => { const d = $('tDesc'); d.classList.toggle('open'); $('readMore').textContent = d.classList.contains('open') ? 'Show less' : 'Read more'; };
  $('allLink').onclick = showAll;

  // all temples
  const chips = $('chips');
  chips.appendChild(mkChip('All', 108));
  REGIONS.forEach(([r]) => chips.appendChild(mkChip(r, new Set(T.filter(t => t.region === r).map(t => t.n)).size)));
  function mkChip(label, count) {
    const b = document.createElement('button'); b.className = 'chip'; b.type = 'button';
    b.innerHTML = label + '<small>' + count + '</small>'; b.setAttribute('aria-pressed', label === region);
    b.onclick = () => { region = label; [...chips.children].forEach(c => c.setAttribute('aria-pressed', c === b)); renderGrid(); };
    return b;
  }
  function renderGrid() {
    const list = region === 'All' ? T : T.filter(t => t.region === region);
    const note = REGIONS.find(r => r[0] === region);
    $('regionNote').textContent = note ? note[1] : 'All 108, in the traditional order from Srirangam to Paramapadam. Ticked ones are the days you have completed.';
    const g = $('grid'); g.innerHTML = '';
    list.forEach(t => {
      const i = T.indexOf(t);
      const b = document.createElement('button'); b.type = 'button'; b.className = 'card' + (i < day ? ' seen' : '');
      b.innerHTML = '<img loading="lazy" alt=""><span class="badge">' + t.n + '</span><span class="done">' + check + '</span><div class="body"><div class="ta" lang="ta"></div><div class="en"></div></div>';
      b.querySelector('img').src = t.img; b.querySelector('.ta').textContent = t.ta || t.name; b.querySelector('.en').textContent = t.ta ? t.name : t.town;
      b.onclick = () => showTemple(i, true);
      g.appendChild(b);
    });
  }
  function showAll() {
    stopSpeech(); renderGrid();
    $('viewTemple').hidden = true; $('viewAll').hidden = false; window.scrollTo(0, 0);
    try { location.hash = 'all'; } catch (e) {}
    $('topLink').textContent = 'Back to today'; $('topLink').onclick = () => showTemple(day - 1);
    $('prevLabel').textContent = 'Today'; $('nextLabel').textContent = ''; $('prevBtn').disabled = false; $('nextBtn').disabled = true;
    $('prevBtn').onclick = () => showTemple(day - 1);
  }

  let toastTimer; function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }

  function route() {
    const m = /^#t(\d{3}[a-z]?)$/.exec(location.hash);
    if (m) { const i = T.findIndex(t => t.key === m[1]); if (i >= 0) return showTemple(i, true); }
    if (location.hash === '#all') return showAll();
    showTemple(day - 1);
  }
  window.addEventListener('hashchange', route);
  renderSound(); route();
  if (CFG.sw && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
